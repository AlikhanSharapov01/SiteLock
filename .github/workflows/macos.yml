name: macOS build and test

# Manual trigger (Actions tab -> "Run workflow") and pull requests only, to save macOS minutes.
on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Universal build
        run: ./scripts/build.sh
      - name: Verify architectures
        run: |
          lipo -info build/sitelockd build/SiteLock.app/Contents/MacOS/SiteLock
          lipo build/sitelockd -verify_arch arm64 x86_64
          lipo build/SiteLock.app/Contents/MacOS/SiteLock -verify_arch arm64 x86_64
          codesign --verify --verbose build/sitelockd build/SiteLock.app
      - name: Shell scripts parse
        run: for f in install.sh uninstall.sh scripts/build.sh; do bash -n "$f"; done
