name: macOS build and test

# Manual trigger (Actions tab -> "Run workflow"), pull requests, and version tags (v1.2.3),
# which also publish SiteLock.zip as a GitHub release. No runs on plain pushes, to save minutes.
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write # only used by the release step
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Universal build
        run: ./scripts/build.sh
      - name: Verify architectures
        run: |
          APP=build/SiteLock.app
          lipo -info "$APP/Contents/MacOS/sitelockd" "$APP/Contents/MacOS/SiteLock"
          lipo "$APP/Contents/MacOS/sitelockd" -verify_arch arm64 x86_64
          lipo "$APP/Contents/MacOS/SiteLock" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose "$APP"
          test "$("$APP/Contents/MacOS/sitelockd" version)" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          test -s build/SiteLock.app/Contents/Resources/AppIcon.icns
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" build/SiteLock.app/Contents/Info.plist
      - name: Scripts parse
        run: bash -n scripts/build.sh && bash -n scripts/e2e.sh
      - name: End-to-end on this runner (install, policies, Chrome blocking, uninstall)
        run: ./scripts/e2e.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/SiteLock.app/Contents/Info.plist)
          test "${GITHUB_REF_NAME#v}" = "$VERSION" || { echo "tag $GITHUB_REF_NAME does not match app version $VERSION"; exit 1; }
          ditto -c -k --keepParent build/SiteLock.app SiteLock.zip
          gh release create "$GITHUB_REF_NAME" SiteLock.zip --title "SiteLock $VERSION" \
            --notes "Universal (Apple silicon + Intel), macOS 13 or later. Install: see README."
