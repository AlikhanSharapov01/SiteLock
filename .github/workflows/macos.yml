name: macOS build and test

# Manual trigger (Actions tab -> "Run workflow") and pull requests only, to save macOS minutes.
on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Universal build
        run: ./scripts/build.sh
      - name: Verify architectures
        run: |
          APP=build/SiteLock.app
          lipo -info "$APP/Contents/MacOS/sitelockd" "$APP/Contents/MacOS/SiteLock"
          lipo "$APP/Contents/MacOS/sitelockd" -verify_arch arm64 x86_64
          lipo "$APP/Contents/MacOS/SiteLock" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose "$APP"
          test "$("$APP/Contents/MacOS/sitelockd" version)" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          test -s build/SiteLock.app/Contents/Resources/AppIcon.icns
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" build/SiteLock.app/Contents/Info.plist
      - name: Build script parses
        run: bash -n scripts/build.sh
